<svg xmlns="http://www.w3.org/2000/svg" width="680" height="441.2" font-family="Inter, system-ui, sans-serif" viewBox="0 0 680 441.2"><defs><marker id="ar-wwft-or-exemption" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#2E5BFF" stroke-width="1.6" d="m1 1 8 4-8 4"/></marker></defs><rect width="632" height="66.5" x="24" y="24" fill="#FFF" stroke="#0B1B33" stroke-dasharray="5 4" rx="10"/><text x="38" y="46.6" fill="#0B1B33" class="m" font-size="10.5" letter-spacing=".08em">THE ADVOCAAT DECIDES</text><text x="38" y="69" fill="#0B1B33" font-size="15" font-weight="600">Which service does the matter concern?</text><path fill="none" stroke="#2E5BFF" stroke-width="1.5" marker-end="url(#ar-wwft-or-exemption)" d="M340 90.5v14H176v19"/><path fill="none" stroke="#2E5BFF" stroke-width="1.5" marker-end="url(#ar-wwft-or-exemption)" d="M340 104.5h164v19"/><rect width="304" height="120.6" x="24" y="126.5" fill="#FFF" stroke="#D5DBE6" rx="10"/><text x="38" y="149.1" fill="#5C6B85" class="m" font-size="10.5" letter-spacing=".08em">SERVICE</text><text x="38" y="170.7" fill="#0B1B33" font-size="14">For example a property transaction,</text><text x="38" y="189.2" fill="#0B1B33" font-size="14">managing assets, setting up a</text><text x="38" y="207.6" fill="#0B1B33" font-size="14">company, share transactions or</text><text x="38" y="226.1" fill="#0B1B33" font-size="14">comparable tax work</text><path fill="none" stroke="#2E5BFF" stroke-width="1.5" marker-end="url(#ar-wwft-or-exemption)" d="M176 250.1v22"/><rect width="304" height="105.9" x="24" y="275.1" fill="#FFF" stroke="#0B1B33" stroke-width="1.5" rx="10"/><text x="38" y="300.6" fill="#0B1B33" font-size="14" font-weight="600">Wwft applies</text><text x="38" y="322.3" fill="#5C6B85" font-size="13">Full client due diligence, and a UBO</text><text x="38" y="340.7" fill="#5C6B85" font-size="13">extract before the business</text><text x="38" y="359.2" fill="#5C6B85" font-size="13">relationship starts</text><rect width="304" height="120.6" x="352" y="126.5" fill="#FFF" stroke="#D5DBE6" rx="10"/><text x="366" y="149.1" fill="#5C6B85" class="m" font-size="10.5" letter-spacing=".08em">SERVICE</text><text x="366" y="170.7" fill="#0B1B33" font-size="14" font-weight="600">Litigation</text><path fill="none" stroke="#2E5BFF" stroke-width="1.5" marker-end="url(#ar-wwft-or-exemption)" d="M504 250.1v22"/><rect width="304" height="105.9" x="352" y="275.1" fill="#FFF" stroke="#0B1B33" stroke-width="1.5" rx="10"/><text x="366" y="300.6" fill="#0B1B33" font-size="14" font-weight="600">Procesvrijstelling</text><text x="366" y="322.3" fill="#5C6B85" font-size="13">The exemption for litigation work,</text><text x="366" y="340.7" fill="#5C6B85" font-size="13">interpreted restrictively</text><text x="24" y="409.6" fill="#5C6B85" font-size="13">The intake form asks the questions and records the outcome in the file.</text></svg>