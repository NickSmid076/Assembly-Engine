<svg xmlns="http://www.w3.org/2000/svg" width="340" height="723.5" font-family="Inter, system-ui, sans-serif" viewBox="0 0 340 723.5"><defs><marker id="ar-wwft-or-exemption-m" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#2E5BFF" stroke-width="1.6" d="m1 1 8 4-8 4"/></marker></defs><rect width="308" height="86.3" x="16" y="16" fill="#FFF" stroke="#0B1B33" stroke-dasharray="5 4" rx="10"/><text x="30" y="38.6" fill="#0B1B33" class="m" font-size="10.5" letter-spacing=".08em">DE ADVOCAAT BESLIST</text><text x="30" y="61" fill="#0B1B33" font-size="15" font-weight="600">Om welke dienst gaat het in deze</text><text x="30" y="80.8" fill="#0B1B33" font-size="15" font-weight="600">zaak?</text><text x="16" y="129.3" fill="#0B1B33" class="m" font-size="11" letter-spacing=".08em">ROUTE 1</text><rect width="308" height="157.6" x="16" y="143.7" fill="#FFF" stroke="#D5DBE6" rx="10"/><text x="30" y="166.3" fill="#5C6B85" class="m" font-size="10.5" letter-spacing=".08em">DIENST</text><text x="30" y="187.9" fill="#0B1B33" font-size="14">Bijvoorbeeld een</text><text x="30" y="206.4" fill="#0B1B33" font-size="14">vastgoedtransactie,</text><text x="30" y="224.8" fill="#0B1B33" font-size="14">vermogensbeheer, het oprichten van</text><text x="30" y="243.3" fill="#0B1B33" font-size="14">een vennootschap,</text><text x="30" y="261.8" fill="#0B1B33" font-size="14">aandelentransacties of</text><text x="30" y="280.3" fill="#0B1B33" font-size="14">vergelijkbaar fiscaal werk</text><path fill="none" stroke="#2E5BFF" stroke-width="1.5" marker-end="url(#ar-wwft-or-exemption-m)" d="M170 304.3v16"/><rect width="308" height="105.9" x="16" y="323.3" fill="#FFF" stroke="#0B1B33" stroke-width="1.5" rx="10"/><text x="30" y="348.8" fill="#0B1B33" font-size="14" font-weight="600">De Wwft geldt</text><text x="30" y="370.4" fill="#5C6B85" font-size="13">Volledig cliëntenonderzoek, en een</text><text x="30" y="388.9" fill="#5C6B85" font-size="13">UBO-uittreksel voordat de zakelijke</text><text x="30" y="407.3" fill="#5C6B85" font-size="13">relatie begint</text><text x="16" y="460.2" fill="#0B1B33" class="m" font-size="11" letter-spacing=".08em">ROUTE 2</text><rect width="308" height="65.2" x="16" y="474.5" fill="#FFF" stroke="#D5DBE6" rx="10"/><text x="30" y="497.1" fill="#5C6B85" class="m" font-size="10.5" letter-spacing=".08em">DIENST</text><text x="30" y="518.7" fill="#0B1B33" font-size="14" font-weight="600">Procederen</text><path fill="none" stroke="#2E5BFF" stroke-width="1.5" marker-end="url(#ar-wwft-or-exemption-m)" d="M170 542.7v16"/><rect width="308" height="87.4" x="16" y="561.7" fill="#FFF" stroke="#0B1B33" stroke-width="1.5" rx="10"/><text x="30" y="587.2" fill="#0B1B33" font-size="14" font-weight="600">Procesvrijstelling</text><text x="30" y="608.9" fill="#5C6B85" font-size="13">De vrijstelling voor proceswerk, die</text><text x="30" y="627.3" fill="#5C6B85" font-size="13">beperkt wordt uitgelegd</text><text x="16" y="681.8" fill="#5C6B85" font-size="13">Het intakeformulier stelt de vragen en</text><text x="16" y="700" fill="#5C6B85" font-size="13">legt de uitkomst vast in het dossier.</text></svg>