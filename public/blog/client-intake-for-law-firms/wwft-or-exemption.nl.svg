<svg xmlns="http://www.w3.org/2000/svg" width="680" height="478.1" font-family="Inter, system-ui, sans-serif" viewBox="0 0 680 478.1"><defs><marker id="ar-wwft-or-exemption" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#2E5BFF" stroke-width="1.6" d="m1 1 8 4-8 4"/></marker></defs><rect width="632" height="66.5" x="24" y="24" fill="#FFF" stroke="#0B1B33" stroke-dasharray="5 4" rx="10"/><text x="38" y="46.6" fill="#0B1B33" class="m" font-size="10.5" letter-spacing=".08em">DE ADVOCAAT BESLIST</text><text x="38" y="69" fill="#0B1B33" font-size="15" font-weight="600">Om welke dienst gaat het in deze zaak?</text><path fill="none" stroke="#2E5BFF" stroke-width="1.5" marker-end="url(#ar-wwft-or-exemption)" d="M340 90.5v14H176v19"/><path fill="none" stroke="#2E5BFF" stroke-width="1.5" marker-end="url(#ar-wwft-or-exemption)" d="M340 104.5h164v19"/><rect width="304" height="157.6" x="24" y="126.5" fill="#FFF" stroke="#D5DBE6" rx="10"/><text x="38" y="149.1" fill="#5C6B85" class="m" font-size="10.5" letter-spacing=".08em">DIENST</text><text x="38" y="170.7" fill="#0B1B33" font-size="14">Bijvoorbeeld een</text><text x="38" y="189.2" fill="#0B1B33" font-size="14">vastgoedtransactie,</text><text x="38" y="207.6" fill="#0B1B33" font-size="14">vermogensbeheer, het oprichten van</text><text x="38" y="226.1" fill="#0B1B33" font-size="14">een vennootschap,</text><text x="38" y="244.6" fill="#0B1B33" font-size="14">aandelentransacties of</text><text x="38" y="263.1" fill="#0B1B33" font-size="14">vergelijkbaar fiscaal werk</text><path fill="none" stroke="#2E5BFF" stroke-width="1.5" marker-end="url(#ar-wwft-or-exemption)" d="M176 287.1v22"/><rect width="304" height="105.9" x="24" y="312.1" fill="#FFF" stroke="#0B1B33" stroke-width="1.5" rx="10"/><text x="38" y="337.6" fill="#0B1B33" font-size="14" font-weight="600">De Wwft geldt</text><text x="38" y="359.2" fill="#5C6B85" font-size="13">Volledig cliëntenonderzoek, en een</text><text x="38" y="377.7" fill="#5C6B85" font-size="13">UBO-uittreksel voordat de zakelijke</text><text x="38" y="396.1" fill="#5C6B85" font-size="13">relatie begint</text><rect width="304" height="157.6" x="352" y="126.5" fill="#FFF" stroke="#D5DBE6" rx="10"/><text x="366" y="149.1" fill="#5C6B85" class="m" font-size="10.5" letter-spacing=".08em">DIENST</text><text x="366" y="170.7" fill="#0B1B33" font-size="14" font-weight="600">Procederen</text><path fill="none" stroke="#2E5BFF" stroke-width="1.5" marker-end="url(#ar-wwft-or-exemption)" d="M504 287.1v22"/><rect width="304" height="105.9" x="352" y="312.1" fill="#FFF" stroke="#0B1B33" stroke-width="1.5" rx="10"/><text x="366" y="337.6" fill="#0B1B33" font-size="14" font-weight="600">Procesvrijstelling</text><text x="366" y="359.2" fill="#5C6B85" font-size="13">De vrijstelling voor proceswerk, die</text><text x="366" y="377.7" fill="#5C6B85" font-size="13">beperkt wordt uitgelegd</text><text x="24" y="446.6" fill="#5C6B85" font-size="13">Het intakeformulier stelt de vragen en legt de uitkomst vast in het dossier.</text></svg>