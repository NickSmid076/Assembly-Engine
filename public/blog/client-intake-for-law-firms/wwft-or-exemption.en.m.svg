<svg xmlns="http://www.w3.org/2000/svg" width="340" height="686.6" font-family="Inter, system-ui, sans-serif" viewBox="0 0 340 686.6"><defs><marker id="ar-wwft-or-exemption-m" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#2E5BFF" stroke-width="1.6" d="m1 1 8 4-8 4"/></marker></defs><rect width="308" height="86.3" x="16" y="16" fill="#FFF" stroke="#0B1B33" stroke-dasharray="5 4" rx="10"/><text x="30" y="38.6" fill="#0B1B33" class="m" font-size="10.5" letter-spacing=".08em">THE ADVOCAAT DECIDES</text><text x="30" y="61" fill="#0B1B33" font-size="15" font-weight="600">Which service does the matter</text><text x="30" y="80.8" fill="#0B1B33" font-size="15" font-weight="600">concern?</text><text x="16" y="129.3" fill="#0B1B33" class="m" font-size="11" letter-spacing=".08em">ROUTE 1</text><rect width="308" height="120.6" x="16" y="143.7" fill="#FFF" stroke="#D5DBE6" rx="10"/><text x="30" y="166.3" fill="#5C6B85" class="m" font-size="10.5" letter-spacing=".08em">SERVICE</text><text x="30" y="187.9" fill="#0B1B33" font-size="14">For example a property transaction,</text><text x="30" y="206.4" fill="#0B1B33" font-size="14">managing assets, setting up a</text><text x="30" y="224.8" fill="#0B1B33" font-size="14">company, share transactions or</text><text x="30" y="243.3" fill="#0B1B33" font-size="14">comparable tax work</text><path fill="none" stroke="#2E5BFF" stroke-width="1.5" marker-end="url(#ar-wwft-or-exemption-m)" d="M170 267.3v16"/><rect width="308" height="105.9" x="16" y="286.3" fill="#FFF" stroke="#0B1B33" stroke-width="1.5" rx="10"/><text x="30" y="311.8" fill="#0B1B33" font-size="14" font-weight="600">Wwft applies</text><text x="30" y="333.5" fill="#5C6B85" font-size="13">Full client due diligence, and a UBO</text><text x="30" y="351.9" fill="#5C6B85" font-size="13">extract before the business</text><text x="30" y="370.4" fill="#5C6B85" font-size="13">relationship starts</text><text x="16" y="423.2" fill="#0B1B33" class="m" font-size="11" letter-spacing=".08em">ROUTE 2</text><rect width="308" height="65.2" x="16" y="437.6" fill="#FFF" stroke="#D5DBE6" rx="10"/><text x="30" y="460.2" fill="#5C6B85" class="m" font-size="10.5" letter-spacing=".08em">SERVICE</text><text x="30" y="481.8" fill="#0B1B33" font-size="14" font-weight="600">Litigation</text><path fill="none" stroke="#2E5BFF" stroke-width="1.5" marker-end="url(#ar-wwft-or-exemption-m)" d="M170 505.8v16"/><rect width="308" height="87.4" x="16" y="524.8" fill="#FFF" stroke="#0B1B33" stroke-width="1.5" rx="10"/><text x="30" y="550.2" fill="#0B1B33" font-size="14" font-weight="600">Procesvrijstelling</text><text x="30" y="571.9" fill="#5C6B85" font-size="13">The exemption for litigation work,</text><text x="30" y="590.4" fill="#5C6B85" font-size="13">interpreted restrictively</text><text x="16" y="644.8" fill="#5C6B85" font-size="13">The intake form asks the questions and</text><text x="16" y="663" fill="#5C6B85" font-size="13">records the outcome in the file.</text></svg>