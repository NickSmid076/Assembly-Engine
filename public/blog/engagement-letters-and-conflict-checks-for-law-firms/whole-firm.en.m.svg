<svg xmlns="http://www.w3.org/2000/svg" width="340" height="528.2" font-family="Inter, system-ui, sans-serif" viewBox="0 0 340 528.2"><text x="16" y="25" fill="#5C6B85" class="m" font-size="11" letter-spacing=".08em">GEDRAGSREGEL 15 LID 6</text><text x="16" y="47.7" fill="#0B1B33" font-size="15" font-weight="600">“Advocaat” covers the whole firm, so</text><text x="16" y="68.7" fill="#0B1B33" font-size="15" font-weight="600">the search does too.</text><rect width="308" height="236" x="16" y="93.4" fill="#FFF" stroke="#D5DBE6" rx="14"/><rect width="264" height="152" x="38" y="137.4" fill="#F5F7FB" stroke="#D5DBE6" rx="12"/><rect width="208" height="82" x="66" y="189.4" fill="#FFF" stroke="#2E5BFF" rx="10"/><text x="30" y="113.6" fill="#5C6B85" class="m" font-size="10" letter-spacing=".08em">THE WHOLE FIRM, INCLUDING CLOSED</text><text x="30" y="127.6" fill="#5C6B85" class="m" font-size="10" letter-spacing=".08em">MATTERS</text><text x="52" y="157.6" fill="#5C6B85" class="m" font-size="10" letter-spacing=".08em">OPEN MATTERS OF COLLEAGUES</text><text x="80" y="209.6" fill="#2E5BFF" class="m" font-size="10" letter-spacing=".08em">YOUR OWN FILES</text><circle cx="284" cy="309.4" r="10" fill="#0B1B33" stroke="#FFF" stroke-width="2"/><text x="284" y="313.4" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">1</text><circle cx="52" cy="259.4" r="10" fill="#0B1B33" stroke="#FFF" stroke-width="2"/><text x="52" y="263.4" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">2</text><circle cx="288" cy="213.4" r="10" fill="#0B1B33" stroke="#FFF" stroke-width="2"/><text x="288" y="217.4" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">3</text><text x="16" y="358.4" fill="#5C6B85" class="m" font-size="11" letter-spacing=".08em">EXAMPLE · NEW CLIENT BAKKERIJ SMIT B.V.</text><circle cx="26" cy="384.8" r="10" fill="#0B1B33" stroke="#FFF" stroke-width="2"/><text x="26" y="388.8" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">1</text><text x="46" y="386.9" fill="#0B1B33" font-size="13.5">The supplier was the opposing party</text><text x="46" y="405.8" fill="#0B1B33" font-size="13.5">in a closed matter, four years ago</text><circle cx="26" cy="434.6" r="10" fill="#0B1B33" stroke="#FFF" stroke-width="2"/><text x="26" y="438.6" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">2</text><text x="46" y="436.7" fill="#0B1B33" font-size="13.5">A director appears in a colleague&apos;s</text><text x="46" y="455.6" fill="#0B1B33" font-size="13.5">open file</text><circle cx="26" cy="484.4" r="10" fill="#0B1B33" stroke="#FFF" stroke-width="2"/><text x="26" y="488.4" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">3</text><text x="46" y="486.5" fill="#0B1B33" font-size="13.5">A client with an almost identical</text><text x="46" y="505.4" fill="#0B1B33" font-size="13.5">name, a different company</text></svg>