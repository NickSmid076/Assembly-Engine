<svg xmlns="http://www.w3.org/2000/svg" width="340" height="543.6" font-family="Inter, system-ui, sans-serif" viewBox="0 0 340 543.6"><text x="16" y="25" fill="#5C6B85" class="m" font-size="11" letter-spacing=".08em">GEDRAGSREGEL 15 LID 6</text><text x="16" y="47.7" fill="#0B1B33" font-size="15" font-weight="600">‘Advocaat’ omvat het hele kantoor,</text><text x="16" y="68.7" fill="#0B1B33" font-size="15" font-weight="600">dus de zoekopdracht ook.</text><rect width="308" height="236" x="16" y="93.4" fill="#FFF" stroke="#D5DBE6" rx="14"/><rect width="264" height="152" x="38" y="137.4" fill="#F5F7FB" stroke="#D5DBE6" rx="12"/><rect width="208" height="82" x="66" y="189.4" fill="#FFF" stroke="#2E5BFF" rx="10"/><text x="30" y="113.6" fill="#5C6B85" class="m" font-size="10" letter-spacing=".08em">HET HELE KANTOOR, OOK GESLOTEN ZAKEN</text><text x="52" y="157.6" fill="#5C6B85" class="m" font-size="10" letter-spacing=".08em">LOPENDE ZAKEN VAN COLLEGA’S</text><text x="80" y="209.6" fill="#2E5BFF" class="m" font-size="10" letter-spacing=".08em">UW EIGEN DOSSIERS</text><circle cx="284" cy="309.4" r="10" fill="#0B1B33" stroke="#FFF" stroke-width="2"/><text x="284" y="313.4" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">1</text><circle cx="52" cy="259.4" r="10" fill="#0B1B33" stroke="#FFF" stroke-width="2"/><text x="52" y="263.4" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">2</text><circle cx="288" cy="213.4" r="10" fill="#0B1B33" stroke="#FFF" stroke-width="2"/><text x="288" y="217.4" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">3</text><text x="16" y="358.4" fill="#5C6B85" class="m" font-size="11" letter-spacing=".08em">VOORBEELD · NIEUWE CLIËNT BAKKERIJ SMIT</text><text x="16" y="373.8" fill="#5C6B85" class="m" font-size="11" letter-spacing=".08em">B.V.</text><circle cx="26" cy="400.2" r="10" fill="#0B1B33" stroke="#FFF" stroke-width="2"/><text x="26" y="404.2" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">1</text><text x="46" y="402.3" fill="#0B1B33" font-size="13.5">De leverancier was vier jaar geleden</text><text x="46" y="421.2" fill="#0B1B33" font-size="13.5">wederpartij in een gesloten zaak</text><circle cx="26" cy="450" r="10" fill="#0B1B33" stroke="#FFF" stroke-width="2"/><text x="26" y="454" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">2</text><text x="46" y="452.1" fill="#0B1B33" font-size="13.5">Een bestuurder komt voor in een</text><text x="46" y="471" fill="#0B1B33" font-size="13.5">lopend dossier van een collega</text><circle cx="26" cy="499.8" r="10" fill="#0B1B33" stroke="#FFF" stroke-width="2"/><text x="26" y="503.8" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">3</text><text x="46" y="501.9" fill="#0B1B33" font-size="13.5">Een cliënt met een bijna gelijke</text><text x="46" y="520.8" fill="#0B1B33" font-size="13.5">naam, een ander bedrijf</text></svg>