<svg xmlns="http://www.w3.org/2000/svg" width="680" height="354.4" font-family="Inter, system-ui, sans-serif" viewBox="0 0 680 354.4"><text x="24" y="33" fill="#5C6B85" class="m" font-size="11" letter-spacing=".08em">GEDRAGSREGEL 15 LID 6</text><text x="24" y="55.7" fill="#0B1B33" font-size="15" font-weight="600">‘Advocaat’ omvat het hele kantoor, dus de zoekopdracht ook.</text><rect width="330" height="250" x="24" y="80.4" fill="#FFF" stroke="#D5DBE6" rx="14"/><rect width="286" height="166" x="46" y="124.4" fill="#F5F7FB" stroke="#D5DBE6" rx="12"/><rect width="230" height="96" x="74" y="176.4" fill="#FFF" stroke="#2E5BFF" rx="10"/><text x="38" y="100.6" fill="#5C6B85" class="m" font-size="10" letter-spacing=".08em">HET HELE KANTOOR, OOK GESLOTEN ZAKEN</text><text x="60" y="144.6" fill="#5C6B85" class="m" font-size="10" letter-spacing=".08em">LOPENDE ZAKEN VAN COLLEGA’S</text><text x="88" y="196.6" fill="#2E5BFF" class="m" font-size="10" letter-spacing=".08em">UW EIGEN DOSSIERS</text><circle cx="314" cy="310.4" r="10" fill="#0B1B33" stroke="#FFF" stroke-width="2"/><text x="314" y="314.4" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">1</text><circle cx="60" cy="260.4" r="10" fill="#0B1B33" stroke="#FFF" stroke-width="2"/><text x="60" y="264.4" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">2</text><circle cx="318" cy="200.4" r="10" fill="#0B1B33" stroke="#FFF" stroke-width="2"/><text x="318" y="204.4" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">3</text><text x="382" y="89.4" fill="#5C6B85" class="m" font-size="11" letter-spacing=".08em">VOORBEELD · NIEUWE CLIËNT BAKKERIJ</text><text x="382" y="104.8" fill="#5C6B85" class="m" font-size="11" letter-spacing=".08em">SMIT B.V.</text><circle cx="392" cy="131.2" r="10" fill="#0B1B33" stroke="#FFF" stroke-width="2"/><text x="392" y="135.2" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">1</text><text x="412" y="133.3" fill="#0B1B33" font-size="13.5">De leverancier was vier jaar</text><text x="412" y="152.2" fill="#0B1B33" font-size="13.5">geleden wederpartij in een</text><text x="412" y="171.1" fill="#0B1B33" font-size="13.5">gesloten zaak</text><circle cx="392" cy="199.9" r="10" fill="#0B1B33" stroke="#FFF" stroke-width="2"/><text x="392" y="203.9" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">2</text><text x="412" y="202" fill="#0B1B33" font-size="13.5">Een bestuurder komt voor in een</text><text x="412" y="220.9" fill="#0B1B33" font-size="13.5">lopend dossier van een collega</text><circle cx="392" cy="249.7" r="10" fill="#0B1B33" stroke="#FFF" stroke-width="2"/><text x="392" y="253.7" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">3</text><text x="412" y="251.8" fill="#0B1B33" font-size="13.5">Een cliënt met een bijna gelijke</text><text x="412" y="270.7" fill="#0B1B33" font-size="13.5">naam, een ander bedrijf</text></svg>